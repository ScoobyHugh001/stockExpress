<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — Express App</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header>
    <nav>
      <a href="/" class="logo"><img src="/images/logo.jpg" alt="RTS Labs" /></a>
      <ul id="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/stocks">Stocks</a></li>
        <li><a href="/about">About</a></li>
        <li id="nav-login"><a href="/login">Login</a></li>
        <li id="nav-signup"><a href="/signup">Sign Up</a></li>
        <li id="nav-logout" class="hidden"><a href="#" id="logout-link">Logout</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="auth-container">
      <h1>Sign Up</h1>
      <form id="signup-form" class="auth-form">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required autocomplete="name" />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password" />
        </div>
        <div id="form-error" class="form-error hidden"></div>
        <button type="submit" class="btn btn-primary">Sign Up</button>
      </form>
      <p class="auth-switch">Already have an account? <a href="/login">Login</a></p>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Express App</p>
  </footer>

  <script src="/js/auth.js"></script>
</body>
</html>
